<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#080b12" />
  <title>Spider Game Prototype</title>
  <link rel="stylesheet" href="./styles.css?v=014" />
  <link rel="stylesheet" href="./settings.css?v=014" />
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="hud">
    <div class="brand">SPIDER GAME <span>v0.1.4</span></div>
    <div id="stats">SPEED 0.0 · ALT 0.0</div>
    <div id="webState">WEB READY</div>
  </div>

  <button id="settingsBtn" class="settingsButton" type="button" aria-label="게임 설정 열기">⚙</button>

  <div id="settingsOverlay" class="settingsOverlay" aria-hidden="true">
    <section class="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settingsHeader">
        <div>
          <div class="settingsEyebrow">GAME SETTINGS</div>
          <h2 id="settingsTitle">설정</h2>
        </div>
        <button id="settingsCloseBtn" class="settingsCloseButton" type="button" aria-label="설정 닫기">×</button>
      </div>

      <div class="settingsGroup">
        <div class="settingTitleRow">
          <label for="cameraDistanceSlider">카메라 거리</label>
          <output id="cameraDistanceValue" for="cameraDistanceSlider">9.0</output>
        </div>
        <input id="cameraDistanceSlider" class="settingsRange" type="range" min="4.5" max="18" step="0.1" value="9" />
        <div class="settingHint">작게 하면 캐릭터에 가까워지고, 크게 하면 멀어져.</div>
      </div>

      <label class="settingsToggleRow" for="cameraDistanceLock">
        <div>
          <div class="settingToggleTitle">거리 고정</div>
          <div class="settingHint">켜면 지정한 카메라 거리를 계속 유지해.</div>
        </div>
        <span class="toggleSwitch">
          <input id="cameraDistanceLock" type="checkbox" checked />
          <span class="toggleTrack"><span class="toggleThumb"></span></span>
        </span>
      </label>

      <div class="settingsFooter">설정은 이 기기에 자동 저장돼.</div>
    </section>
  </div>

  <div id="crosshair" aria-hidden="true"><span></span><span></span></div>

  <div id="help">
    <b>조작</b>
    <span>WASD 이동 · Space 점프 · 좌클릭 드래그 시점</span>
    <span>패드: 왼쪽 조이스틱 이동 · 빈 화면을 위로 밀면 하늘 보기</span>
    <span>우클릭 유지 웹 스윙 · E 웹 토글 · F 웹 집 · Shift 스윙 부스트</span>
  </div>

  <div id="toast"></div>

  <div id="mobileControls">
    <div id="joystick" class="joystick">
      <div id="stick"></div>
    </div>
    <div class="mobileButtons">
      <button id="webBtn" type="button">WEB</button>
      <button id="zipBtn" type="button">ZIP</button>
      <button id="jumpBtn" type="button">JUMP</button>
    </div>
  </div>

  <script src="./game.js?v=014"></script>
  <script src="./camera-fix.js?v=014"></script>
</body>
</html>
